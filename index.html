<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>五行财富爆发力与天命财局测评</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- html2canvas 用于长图保存 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --bg-color: #0d0e12;
      --card-bg: #181a20;
      --gold-primary: #d4af37;
      --gold-light: #f3e5ab;
      --vermilion: #c83a2a;
      --text-light: #e6e6e6;
      --text-dim: #999999;
      --border-color: rgba(212, 175, 55, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-color);
      color: var(--text-light);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.6;
      padding-bottom: 40px;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .header-title {
      text-align: center;
      color: var(--gold-primary);
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: var(--text-dim);
      font-size: 13px;
      margin-bottom: 20px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
      color: #000;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s ease;
    }

    .btn:active { transform: scale(0.98); opacity: 0.9; }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--gold-primary);
      color: var(--gold-primary);
    }

    input, select {
      width: 100%;
      padding: 12px;
      background: #0d0e12;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #fff;
      font-size: 15px;
      margin-top: 6px;
      margin-bottom: 16px;
    }

    .hidden { display: none !important; }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: var(--text-light);
      margin-bottom: 12px;
      cursor: pointer;
      font-size: 14px;
      line-height: 1.5;
    }

    .option-btn:hover, .option-btn:active {
      border-color: var(--gold-primary);
      background: rgba(212, 175, 55, 0.1);
    }

    .canvas-box {
      width: 100%;
      display: flex;
      justify-content: center;
      margin: 15px 0;
    }

    canvas { max-width: 100%; height: auto; }

    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- 1. 激活码登录视图 -->
  <div id="auth-view" class="card">
    <div class="header-title">五行财富爆发力测评</div>
    <div class="subtitle">请输入您的8位专属激活验证码</div>
    <input type="text" id="pass-input" placeholder="请输入8位卡密代码" maxlength="8" style="text-transform: uppercase;">
    <button class="btn" onclick="verifyPassword()">验证激活码</button>
  </div>

  <!-- 2. 信息采集视图 -->
  <div id="info-view" class="card hidden">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
      <span style="font-size: 12px; color: var(--gold-primary);" id="quota-tag">剩余次数：-</span>
      <span style="font-size: 12px; color: var(--text-dim);" id="code-tag"></span>
    </div>
    <div class="header-title">开启天命财盘</div>
    <label style="font-size: 13px; color: var(--text-dim);">性别</label>
    <select id="gender-input">
      <option value="male">男</option>
      <option value="female">女</option>
    </select>

    <label style="font-size: 13px; color: var(--text-dim);">出生日期（公历）</label>
    <input type="date" id="birth-input" value="1998-08-18">

    <button class="btn" onclick="startQuiz()">开始测算天命五行</button>
  </div>

  <!-- 3. 题目答题视图 -->
  <div id="quiz-view" class="card hidden">
    <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--text-dim); margin-bottom:10px;">
      <span id="quiz-progress">题目 1 / 12</span>
      <span id="back-btn" style="color:var(--gold-primary); cursor:pointer;" onclick="prevQuestion()">← 返回上一题</span>
    </div>
    <div id="question-text" style="font-weight:bold; font-size:16px; margin-bottom:16px; color:var(--gold-light);"></div>
    <div id="options-box"></div>
  </div>

  <!-- 4. 测评结果视图 -->
  <div id="result-view" class="hidden">
    <div id="capture-area" class="card">
      <div class="header-title">天命财局诊断报告</div>
      <div class="subtitle" id="result-rank" style="color:var(--vermilion); font-weight:bold; font-size:16px;"></div>

      <div style="text-align:center; margin:15px 0;">
        <div style="font-size:13px; color:var(--text-dim);">原生五行气场雷达图</div>
        <div class="canvas-box"><canvas id="elementCanvas" width="300" height="260"></canvas></div>
      </div>

      <div style="text-align:center; margin:15px 0;">
        <div style="font-size:13px; color:var(--text-dim);">后天商业变现力雷达图</div>
        <div class="canvas-box"><canvas id="abilityCanvas" width="300" height="260"></canvas></div>
      </div>

      <div style="border-top:1px dashed var(--border-color); padding-top:15px; margin-top:15px;">
        <h4 style="color:var(--gold-primary); margin-bottom:8px;">财局格局诊断</h4>
        <p id="desc-text" style="font-size:13px; color:#ccc; line-height:1.7;"></p>
      </div>

      <div style="border-top:1px dashed var(--border-color); padding-top:15px; margin-top:15px;">
        <h4 style="color:var(--gold-primary); margin-bottom:8px;">财富建议与增运锦囊</h4>
        <p id="advice-text" style="font-size:13px; color:#ccc; line-height:1.7;"></p>
      </div>
    </div>

    <button class="btn" onclick="saveAsImage()">📸 保存长图到手机</button>
    <button class="btn btn-secondary" onclick="copyResultLink()">🔗 复制结果分享链接</button>
    <button class="btn btn-secondary" onclick="showRewardModal()">🎁 好评领 1 元返现</button>
    <button class="btn btn-secondary" onclick="retakeTest()">🔄 再测一次</button>
  </div>

</div>

<!-- 好评弹窗 -->
<div id="reward-modal" class="modal hidden">
  <div class="card" style="width: 100%; max-width: 320px; text-align: center;">
    <h3 style="color:var(--gold-primary); margin-bottom: 10px;">好评有礼返现</h3>
    <p style="font-size: 13px; color:#ccc; margin-bottom: 15px;">给店铺留下带图好评后，截图联系客服微信即可立领 1 元现金红包！</p>
    <button class="btn" onclick="closeRewardModal()">我知道了</button>
  </div>
</div>

<script>
  // Supabase 初始化参数
  const SUPABASE_URL = "https://soukyhofukxpujapoczo.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_73AOiU4et0DJk1aFmlz4Zg_CNIZrknX";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentCode = "";
  let currentQuota = 0;
  let currentStep = 0;
  let userAnswers = [];

  const questions = [
    { text: "1. 假如你手头存下了第一笔 10 万元闲钱，你的第一反应是：", options: ["找热门短视频/带货副业拿2-3万试水", "报高阶技能班或考硬核证书拉高单价", "请行业大佬或有资源的朋友吃高质量饭局", "存大额存单或买低风险理财落袋为安"] },
    { text: "2. 看到身边原本平平无奇的朋友靠做爆款短视频暴富，你最真实的内心想法：", options: ["抓到流量密码了，我立刻研究他的脚本开干", "靠运气难持久，我还是把专业手艺练扎实", "他缺后端供应链，我去联系他合作分一杯羹", "爆火背后有风险，我先观察半年看能否稳住"] },
    { text: "3. 如果你决定开启一份副业，你最希望它的状态是：", options: ["爆发力强，踩中一次风口就能变现几万十几万", "越老越吃香，能形成自己的作品与IP", "轻资产轻交付，做中间撮合或资源转介绍", "极其稳定，付出固定时间稳拿确定性收益"] },
    { text: "4. 在一个 100 人的商业交流群里，你最常扮演的角色是：", options: ["常发金句晒新资讯，大家眼中的消息灵通人士", "潜水居多，但遇到专业问题能给出硬核解答", "积极搭桥牵线，熟练帮忙对接买卖双方", "静静观察，收集价格差、需求与避坑经验"] },
    { text: "5. 当你发现一个看似赚钱的新项目时，最先评估的指标是：", options: ["传播力够不够快？能否迅速吸睛？", "底层逻辑和交付质量过不过关？", "需要搞定哪些关键决策人？手里有无现成资源？", "回款周期多久？最坏情况会亏损多少？"] },
    { text: "6. 面对高风险高回报与低风险低回报的选择时：", options: ["选高回报，富贵险中求，平庸才是最大风险", "凭专业能力将高风险转化为可控风险再尝试", "看组局的人是谁，跟着大佬贵人走可以跟进", "坚决选低风险，现金为王，绝不拿本金去赌"] },
    { text: "7. 搞钱过程中遭遇连续一个月无收益的瓶颈期，你的第一动作是：", options: ["快速切赛道，换当下最火的新玩法", "复盘流程，优化产品细节与复购率", "约同行或老客喝茶，寻求合作转介绍", "迅速止损精简开支，苟住等待时机"] },
    { text: "8. 你认为自己最大的搞钱障碍通常是：", options: ["容易三分钟热度，缺乏长期落地的耐心", "太完美主义，非要准备到100分才敢推向市场", "太过顾及面子，不好意思直接谈钱", "过于保守谨慎，看清机会时汤都被喝完了"] },
    { text: "9. 副业需要做个人宣发时，你对出镜露脸的态度是：", options: ["完全无包袱，表现力拉满吸睛第一", "能展现专业深度不排斥出镜，但必须有干货", "更喜欢在私域一对一沟通中展现个人魅力", "能幕后绝不台前，最好用自动化工具运作"] },
    { text: "10. 面对客户提出超出原服务范围的要求，你会：", options: ["顺势推荐高客单升级包，撬动更大金额", "评估是否符合专业原则，符合则加班做好", "展现高情商，协调第三方资源搞定并收转介费", "严格按合同执行，增加需求加钱，明确权责"] },
    { text: "11. 你理想中的财富自由状态是：", options: ["站在聚光灯下，拥有巨大影响力和爆款产业", "成为行业内受人尊敬的顶尖专家大师", "拥有庞大人脉网络，打个电话撬动百万项目", "拥有几套稳定出租的房产与吃利息的资产"] },
    { text: "12. 最触动你的一句搞钱座右铭是：", options: ["站在风口上，猪都能飞起来，唯快不破", "十年磨一剑，流水不争先，争的是滔滔不绝", "单打独斗不如合纵连横，财聚人散人聚财来", "留得青山在不怕没柴烧，落袋才是安"] }
  ];

  async function verifyPassword() {
    const code = document.getElementById('pass-input').value.trim().toUpperCase();
    if (!code || code.length !== 8) return alert('请输入8位有效激活码');

    const { data, error } = await supabaseClient
      .from('activation_codes')
      .select('code, remaining_uses')
      .eq('code', code)
      .single();

    if (error || !data) return alert('激活码不存在或无效');
    if (data.remaining_uses <= 0) return alert('该激活码3次测试额度已用尽');

    currentCode = data.code;
    currentQuota = data.remaining_uses;

    document.getElementById('auth-view').classList.add('hidden');
    document.getElementById('info-view').classList.remove('hidden');
    document.getElementById('quota-tag').innerText = `剩余次数：${currentQuota} 次`;
    document.getElementById('code-tag').innerText = `卡密：${currentCode}`;
  }

  function startQuiz() {
    document.getElementById('info-view').classList.add('hidden');
    document.getElementById('quiz-view').classList.remove('hidden');
    currentStep = 0;
    userAnswers = [];
    renderQuestion();
  }

  function renderQuestion() {
    const q = questions[currentStep];
    document.getElementById('quiz-progress').innerText = `题目 ${currentStep + 1} / 12`;
    document.getElementById('question-text').innerText = q.text;
    document.getElementById('back-btn').style.visibility = currentStep === 0 ? 'hidden' : 'visible';

    const box = document.getElementById('options-box');
    box.innerHTML = '';
    q.options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerText = opt;
      btn.onclick = () => selectOption(idx);
      box.appendChild(btn);
    });
  }

  function prevQuestion() {
    if (currentStep > 0) {
      currentStep--;
      userAnswers.pop();
      renderQuestion();
    }
  }

  async function selectOption(idx) {
    userAnswers.push(idx);
    if (currentStep < questions.length - 1) {
      currentStep++;
      renderQuestion();
    } else {
      // 扣减云端数据库测试次数
      currentQuota--;
      await supabaseClient
        .from('activation_codes')
        .update({ remaining_uses: currentQuota })
        .eq('code', currentCode);

      showResult();
    }
  }

  function showResult() {
    document.getElementById('quiz-view').classList.add('hidden');
    document.getElementById('result-view').classList.remove('hidden');

    document.getElementById('result-rank').innerText = "SSS级·离火风口提款机";
    document.getElementById('desc-text').innerText = "你的天命气场中【火】与【土】能量充沛，具备极强的风口敏锐度与传播爆发力。适合做个人IP、短视频流转与流量变现。";
    document.getElementById('advice-text').innerText = "推荐方向：个人IP、知识付费、快闪副业。建议搭配【金/土】属性的高效后勤合伙人做风控落袋。";

    drawRadar('elementCanvas', [80, 65, 45, 90, 50], ["金", "木", "水", "火", "土"]);
    drawRadar('abilityCanvas', [85, 60, 70, 55], ["破局力", "建构力", "润局力", "守局力"]);
  }

  function drawRadar(canvasId, values, labels) {
    const canvas = document.getElementById(canvasId);
    const ctx = canvas.getContext('2d');
    const cx = 150, cy = 130, r = 80;
    ctx.clearRect(0, 0, 300, 260);

    const n = labels.length;
    ctx.strokeStyle = "rgba(212,175,55,0.3)";
    ctx.fillStyle = "rgba(212,175,55,0.2)";

    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const angle = (Math.PI * 2 / n) * i - Math.PI / 2;
      const x = cx + Math.cos(angle) * r;
      const y = cy + Math.sin(angle) * r;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);

      ctx.fillStyle = "#d4af37";
      ctx.font = "12px sans-serif";
      ctx.fillText(labels[i], cx + Math.cos(angle) * (r + 18) - 8, cy + Math.sin(angle) * (r + 18) + 4);
    }
    ctx.closePath();
    ctx.stroke();

    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const angle = (Math.PI * 2 / n) * i - Math.PI / 2;
      const val = values[i] / 100;
      const x = cx + Math.cos(angle) * (r * val);
      const y = cy + Math.sin(angle) * (r * val);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = "rgba(200, 58, 42, 0.4)";
    ctx.fill();
    ctx.strokeStyle = "#c83a2a";
    ctx.stroke();
  }

  function saveAsImage() {
    html2canvas(document.getElementById('capture-area')).then(canvas => {
      const link = document.createElement('a');
      link.download = '五行财局诊断报告.png';
      link.href = canvas.toDataURL();
      link.click();
    });
  }

  function copyResultLink() {
    navigator.clipboard.writeText(window.location.href);
    alert('测试链接已成功复制到剪贴板！');
  }

  function showRewardModal() { document.getElementById('reward-modal').classList.remove('hidden'); }
  function closeRewardModal() { document.getElementById('reward-modal').classList.add('hidden'); }

  function retakeTest() {
    if (currentQuota <= 0) return alert('当前卡密剩余测试次数为0，请购买新卡密');
    document.getElementById('result-view').classList.add('hidden');
    document.getElementById('info-view').classList.remove('hidden');
    document.getElementById('quota-tag').innerText = `剩余次数：${currentQuota} 次`;
  }
</script>
</body>
</html>
